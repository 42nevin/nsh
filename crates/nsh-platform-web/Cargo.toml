[package]
name = "nsh-platform-web"
description = "WebAssembly backend: runs nsh apps in a browser, rendering to the DOM (the website's live demos)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Empty off WebAssembly (like the other platform crates off their targets).
[target.'cfg(target_arch = "wasm32")'.dependencies]
nsh-core.workspace = true
nsh-anim.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-ui-mobile.workspace = true
serde_json.workspace = true
log.workspace = true
rustc-hash.workspace = true
ttf-parser.workspace = true
