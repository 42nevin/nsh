<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nsh player</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #000; } }
  #app { position: fixed; inset: 0; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #8a8a8e; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status">Loading…</div>
<script type="module">
  // Runs website demo `#<name>` (demos/<name>.js, bundled by `nsh build`).
  // `?theme=dark|light` overrides the system appearance.
  import { createPlayer } from "./nsh.js";

  const status = document.getElementById("status");
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme");
  const options = { assetBase: new URL("assets/", location.href).href };
  if (theme === "dark" || theme === "light") options.dark = theme === "dark";
  if (options.dark) document.documentElement.style.background = "#000";

  async function start() {
    const name = decodeURIComponent(location.hash.slice(1)) || "counter";
    status.textContent = "Loading…";
    status.style.display = "";
    try {
      const [player, code] = await Promise.all([
        window.player ?? createPlayer(document.getElementById("app"), options),
        fetch(`demos/${encodeURIComponent(name)}.js`).then((r) => {
          if (!r.ok) throw new Error(`no demo named “${name}”`);
          return r.text();
        }),
      ]);
      window.player = player;
      status.style.display = "none";
      player.run(code);
    } catch (err) {
      status.textContent = String(err.message ?? err);
    }
  }

  // The embedding page can switch the appearance: postMessage({ theme }).
  addEventListener("message", (e) => {
    const t = e.data?.theme;
    if ((t === "dark" || t === "light") && window.player) {
      document.documentElement.style.background = t === "dark" ? "#000" : "#fff";
      window.player.setDark(t === "dark");
    }
  });
  addEventListener("hashchange", start);
  start();
</script>
</body>
</html>
