[package]
name = "nsh-ffi"
description = "C ABI for embedding nsh apps in existing iOS apps (static library + header)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "nsh"
crate-type = ["staticlib", "rlib"]

[features]
# Loading from a `nsh dev` server, with on-screen errors and log forwarding.
dev = ["nsh-platform-apple/dev"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-apple.workspace = true
nsh-engine.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-ui-kit.workspace = true
