[package]
name = "nsh-platform-android"
description = "Android backend: JNI glue, StaticLayout text engine, mount batch encoding, native animation driver."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "nsh"
crate-type = ["cdylib", "rlib"]

[features]
# Development support: dev server client, log forwarding, error overlay.
dev = ["dep:nsh-dev"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
nsh-core.workspace = true
nsh-engine.workspace = true
serde_json.workspace = true
nsh-anim.workspace = true
rustc-hash.workspace = true
ttf-parser.workspace = true
libc.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
