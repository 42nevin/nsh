[package]
name = "yf-platform-apple"
description = "UIKit backend: native view mounting, text measurement, input and app hosting."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Development host support: dev-server client, log forwarding, error overlay.
dev = ["dep:yf-dev"]

[dependencies]
yf-core.workspace = true
yf-engine.workspace = true
log.workspace = true
yf-dev = { workspace = true, features = ["client"], optional = true }

# UIKit exists on iOS, the iOS simulator and Mac Catalyst (all `target_os = "ios"`).
[target.'cfg(target_os = "ios")'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-image-io.workspace = true
block2.workspace = true
yf-anim.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-ui-kit.workspace = true
rustc-hash.workspace = true
