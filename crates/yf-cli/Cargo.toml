[package]
name = "yf-cli"
description = "The yf command line tool: build, package and run apps."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "yf"
path = "src/main.rs"

[dependencies]
yf-bundler.workspace = true
yf-core.workspace = true
yf-engine.workspace = true
yf-dev = { workspace = true, features = ["server"] }
yf-js.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
notify.workspace = true
log.workspace = true
libc.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
plist.workspace = true
zip.workspace = true
image.workspace = true
